[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jhtdb-regimes"
version = "0.1.0"
description = "Testing-token-safe JHTDB acceleration regime pipeline"
requires-python = ">=3.10"
dependencies = [
  "givernylocal>=3.6.2,<4",
  "numpy>=1.23,<3",
  "pandas>=1.5,<3",
  "PyYAML>=6,<7",
  "scipy>=1.9,<2",
  "streamlit>=1.40,<2",
  "plotly>=5,<7",
]

[project.scripts]
jhtdb-regimes = "jhtdb_regimes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
