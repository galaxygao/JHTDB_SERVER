dataset: isotropic1024coarse
variable: velocity
grid_shape: [1024, 1024, 1024]
domain_length: 6.283185307179586
stored_time_step: 0.002

auth:
  backend: windows_credential_manager
  service: jhtdb_pipeline
  username: default

download:
  backend: local
  tile_shape: [128, 128, 128]
  retries: 5
  backoff_seconds: 2.0
  request_cooldown_seconds: 0.25

storage:
  root: C:/Users/gao/JHTDB_DATA
  compression_level: 3
  safety_free_space_gib: 40

validation:
  seam_width: 4
  divergence_relative_rms_max: 1.0e-4
  divergence_relative_max_max: 1.0e-3

physics:
  sigma_grid: 1.0
  epsilon_abs: 0.0
  epsilon_rel: 0.001
  fft_slab_width: 4
  keep_intermediates: false
